[workspace]
members = ["crates/model", "crates/secret", "crates/systemd", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bento-boot-model = { path = "crates/model" }
bento-boot-secret = { path = "crates/secret" }
bento-boot-systemd = { path = "crates/systemd" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
